<main class="mx-auto p-6">
  <header class="mb-6">
    <h1 class="text-2xl font-semibold text-base-content">
      Local Dev Rapid Demo
    </h1>
    <p id="dev-rapid-status" class="text-sm text-base-content/70">
      Waiting for Ladon rapid runtime...
    </p>
  </header>

  <section class="rounded-lg bg-base-100 p-4 shadow">
    <h2 class="mb-2 text-lg font-medium text-base-content">Runtime</h2>
    <dl class="grid grid-cols-[auto,1fr] gap-x-4 gap-y-2 text-sm">
      <dt class="font-medium">fetchClient</dt>
      <dd id="dev-rapid-fetch-client">pending</dd>
      <dt class="font-medium">auth</dt>
      <dd id="dev-rapid-auth">pending</dd>
      <dt class="font-medium">utility</dt>
      <dd id="dev-rapid-utility">pending</dd>
    </dl>
  </section>
</main>

<script type="module">
  const status = document.querySelector("#dev-rapid-status");
  const fetchClientStatus = document.querySelector("#dev-rapid-fetch-client");
  const authStatus = document.querySelector("#dev-rapid-auth");
  const utilityStatus = document.querySelector("#dev-rapid-utility");

  try {
    const ladonRapid = await window.ladonRapidReady;
    fetchClientStatus.textContent = ladonRapid.fetchClient?.DocumentsApi
      ? "available"
      : "missing";
    authStatus.textContent = ladonRapid.auth?.ensureAuthenticated
      ? "available"
      : "missing";
    utilityStatus.textContent = ladonRapid.utility?.formatFileSize
      ? "available"
      : "missing";
    status.textContent = "Local dev rapid loaded.";
  } catch (error) {
    status.textContent = `Runtime failed: ${error.message}`;
    console.error(error);
  }
</script>
