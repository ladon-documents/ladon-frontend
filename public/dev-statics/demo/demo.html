<main class="mx-auto p-6">
  <header class="mb-6">
    <h1 class="text-2xl font-semibold text-base-content">Local Dev Static Demo</h1>
    <p id="dev-static-status" class="text-sm text-base-content/70">Waiting for Ladon static runtime...</p>
  </header>

  <section class="rounded-lg bg-base-100 p-4 shadow">
    <h2 class="mb-2 text-lg font-medium text-base-content">Runtime</h2>
    <dl class="grid grid-cols-[auto,1fr] gap-x-4 gap-y-2 text-sm">
      <dt class="font-medium">fetchClient</dt>
      <dd id="dev-static-fetch-client">pending</dd>
      <dt class="font-medium">auth</dt>
      <dd id="dev-static-auth">pending</dd>
      <dt class="font-medium">utility</dt>
      <dd id="dev-static-utility">pending</dd>
    </dl>
  </section>
</main>

<script type="module">
  const status = document.querySelector('#dev-static-status');
  const fetchClientStatus = document.querySelector('#dev-static-fetch-client');
  const authStatus = document.querySelector('#dev-static-auth');
  const utilityStatus = document.querySelector('#dev-static-utility');

  try {
    const ladonStatic = await window.ladonStaticReady;
    fetchClientStatus.textContent = ladonStatic.fetchClient?.DocumentsApi ? 'available' : 'missing';
    authStatus.textContent = ladonStatic.auth?.ensureAuthenticated ? 'available' : 'missing';
    utilityStatus.textContent = ladonStatic.utility?.formatFileSize ? 'available' : 'missing';
    status.textContent = 'Local dev static loaded.';
  } catch (error) {
    status.textContent = `Runtime failed: ${error.message}`;
    console.error(error);
  }
</script>
