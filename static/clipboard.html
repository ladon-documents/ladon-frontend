    window.MFallowDrop = (ev) => {
        ev.preventDefault();
    };
    window.MFdragstart_handler = (ev) => {
        const { target } = ev;
        target.classList.add("dragging");
        var ladondoc = JSON.stringify(data);
        ev.dataTransfer.setData("text", ladondoc);
        ev.effectAllowed = "copyMove";
    };
    window.MFdragover_handler = (ev) => {
        console.log("dragOver");
        ev.currentTarget.style.background = "lightblue";
        ev.preventDefault();
    };

    window.MFdragend_handler = (ev) => {
        const { target } = ev;
        target.classList.remove("dragging");
    };
    window.addAllDocument = () => {
        // dispatch event. detail must be an Array of LadonDocuments
        window.dispatchEvent(new CustomEvent("ladon:clipboard:documents:add", { detail: JSON.stringify(data) }));
    };

  </div>
  <button onclick="addAllDocument()">Select all Documents</button>
