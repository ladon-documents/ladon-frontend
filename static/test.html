<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ladon Static API Test</title>
  <script type="module" src="./ladon-static.mjs"></script>
</head>
<body>
  <main class="prose mx-auto p-6">
    <h1>Ladon Static API Test</h1>
    <p id="status">Initializing Ladon static runtime...</p>
  </main>
  <script type="module">
    const status = document.querySelector('#status');

    try {
      const ladon = await window.ladonStaticReady;
      status.textContent = `Runtime loaded. Fetch APIs available: ${Object.keys(ladon.fetchClient).length}`;
    } catch (error) {
      status.textContent = `Runtime failed: ${error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
