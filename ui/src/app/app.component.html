@if (isAuthenticating()) {
  <span class="loading loading-ring loading-xl"></span>
} @else {
  @if (isAuthenticated()) {
    <div class="flex flex-col h-screen">
      <app-header class="shadow-md z-50"></app-header>

      <div class="flex flex-1 h-full overflow-auto px-2">
        <lib-navigation
          class="px-2 py-4"
          [navigation]="navigationEntries"
          [ngClass]="{ hidden: !store.ui.isBurgerMenuOpen() }"></lib-navigation>
        <main class="flex-1 min-w-0 overflow-auto transition-all duration-300">
          <div class="px-2 py-4 h-full">
            <div class="rounded-lg shadow overflow-hidden transition-colors duration-200 h-full">
              <router-outlet></router-outlet>
            </div>
          </div>
        </main>
      </div>
    </div>
  } @else {
    <div class="flex h-screen overflow-hidden">
      <div class="w-full h-screen overflow-y-auto grow">
        <main role="main">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  }
}
