<div class="breadcrumbs text-sm">
  <ul>
    <li (click)="showRoot()" class="cursor-pointer">Meine Dateien</li>
    @for (path of store.paths(); track path.key; let i = $index) {
      <li [class.cursor-pointer]="true" (click)="onNavigate(i)">
        {{ path.name }}
      </li>
    }
  </ul>
</div>
