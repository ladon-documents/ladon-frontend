@if (imageUrl) {
  <div class="w-full">
    <img
      [src]="imageUrl"
      alt="Dokument Vorschau"
      class="h-auto w-full rounded-lg border border-gray-500/40 object-contain shadow-sm"
      (error)="onImageError($event)" />
  </div>
}

@if (isLoading) {
  <div class="flex h-64 items-center justify-center text-gray-500">
    <div class="text-center">
      <div class="mx-auto mb-4 h-12 w-12 animate-spin rounded-full border-b-2 border-blue-500"></div>
      <p>Lade Vorschau...</p>
    </div>
  </div>
}

@if (selectedDocument() && !selectedDocument()?.isFolder) {
  @if (hasPrimaryAction()) {
    <div class="mt-4">
      <button class="btn btn-primary w-full" type="button" (click)="openPrimaryAction()">
        {{ getPrimaryActionLabel() }}
      </button>
    </div>
  }

  <app-document-tags [document]="selectedDocument()"></app-document-tags>
}
