@if (isOpen) {
  <div class="w-96 bg-white">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-gray-200">
      <h2 class="text-lg font-mediu text-gray-800">{{ selectedDocument()?.key }}</h2>
      <button (click)="closeSidebar()" class="p-2 rounded-full hover:bg-gray-100 transition-colors duration-200">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="p-4 h-full overflow-y-auto">
      <filemanager-preview></filemanager-preview>
      <filemanager-meta></filemanager-meta>
    </div>
  </div>

}

<file-editor-dialog
                    [config]="{
                      readOnly: false,
                      fileName:selectedDocument()?.key || ''
                    }">
</file-editor-dialog>
