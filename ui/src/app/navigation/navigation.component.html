<aside class="border-r border-gray-100 dark:border-gray-200">
  <!-- Sidebar Navigation -->
  <nav class="mt-4 px-2">
    <ul class="space-y-1">
      @for (item of mainMenu(); track $index) {
        <li [ngStyle]="{ '--order': item.index, order: 'var(--order)' }" [attr.data-target]="item.target">
          <a
            (click)="invokeItem(item)"
            [ngClass]="{ 'text-blue-700': routerActiveLink === item.path }"
            class="flex items-center gap-1 px-2 py-1 hover:cursor-pointer hover:text-blue-700">
            @if (item.icon) {
              <ng-icon [name]="item.icon" style="color: currentColor"></ng-icon>
            }
            <span class="ml-3 text-sm font-medium" [ngClass]="{ hidden: sidebarCollapsed() }">{{
              item.label | translate
            }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="flex items-center justify-between p-4">
    <button
      class="p-1 rounded-md hover:bg-gray-200 dark:hover:bg-gray-200 focus:outline-none transition-colors duration-200"
      (click)="collapseSidebar()"
      aria-label="Seitenleiste minimieren">
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        [ngClass]="{ 'rotate-180': sidebarCollapsed() }">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
      </svg>
    </button>
  </div>
</aside>
