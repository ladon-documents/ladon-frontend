<section class="grid h-full min-h-0 grid-cols-1 overflow-hidden bg-base-100 md:grid-cols-[minmax(20rem,24rem)_1fr]">
  <aside class="flex min-h-0 flex-col border-r border-base-300">
    <div class="space-y-3 border-b border-base-300 p-4">
      <app-plugin-channel-nav
        [channels]="channels()"
        [activeChannel]="activeChannel()"
        (channelSelected)="channelSelected.emit($event)">
      </app-plugin-channel-nav>
      <app-plugin-search [searchTerm]="searchTerm()" (searchTermChange)="searchTermChange.emit($event)">
      </app-plugin-search>
    </div>

    <div class="min-h-0 flex-1 overflow-auto">
      <app-plugin-list
        [plugins]="plugins()"
        [selectedPluginId]="selectedPluginId()"
        [activeAction]="activeAction()"
        [isLoading]="isLoadingPlugins()"
        (pluginSelected)="pluginSelected.emit($event)">
      </app-plugin-list>
    </div>
  </aside>

  <main class="min-h-0 overflow-auto">
    @if (selectedPlugin(); as plugin) {
      <app-plugin-detail
        [plugin]="plugin"
        [activeAction]="activeAction()"
        [actionError]="actionError()"
        (actionTriggered)="actionTriggered.emit($event)">
      </app-plugin-detail>
    } @else {
      <app-plugin-overview [overview]="overview()" [error]="loadError()"></app-plugin-overview>
    }
  </main>
</section>
