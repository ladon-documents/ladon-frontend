<app-plugin-workbench
  [channels]="store.channels()"
  [activeChannel]="store.activeChannel()"
  [plugins]="store.filteredItems()"
  [selectedPlugin]="store.selectedPlugin()"
  [selectedPluginId]="store.selectedPluginId()"
  [searchTerm]="store.searchTerm()"
  [overview]="store.overview()"
  [activeAction]="store.activeAction()"
  [loadError]="store.loadError()"
  [actionError]="store.actionError()"
  [isLoadingPlugins]="store.isLoadingPlugins()"
  (channelSelected)="onChannelSelected($event)"
  (searchTermChange)="store.setSearchTerm($event)"
  (pluginSelected)="store.selectPlugin($event)"
  (actionTriggered)="onActionTriggered($event)">
</app-plugin-workbench>
