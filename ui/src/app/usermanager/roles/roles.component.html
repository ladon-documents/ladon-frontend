<div class="flex justify-between items-center gap-4">
  <app-filter (outputTerm)="onFilterTerm($event)"></app-filter>
  <button class="btn btn-primary" (click)="createRole()">
    <ng-icon name="heroPlusCircle" size="1.5rem" class="shrink-0" color="text-white"></ng-icon>
    <span class="hidden lg:block">Neue Rolle anlegen</span>
  </button>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Name</th>
    </tr>
  </thead>
  <tbody>
    @for (role of filteredRoles; track role.id) {
      <tr>
        <td>
          <div class="flex items-center gap-4">
            <div class="avatar shrink-0 transition-colors" [attr.data-alias]="role.name | alias"></div>
            <div class="flex flex-col">
              {{ role.name }}
              @if (role.details) {
                <span class="text-xs opacity-70">{{ role.details }}</span>
              }
            </div>
          </div>
        </td>
      </tr>
    }
  </tbody>
</table>

<app-dialog title="Neue Rolle anlegen"></app-dialog>
