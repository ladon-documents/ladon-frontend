<div class="flex justify-between items-center gap-4 p-4">
  <app-filter (outputTerm)="onFilterTerm($event)"></app-filter>
  <button class="btn btn-primary btn-sm" (click)="createRole()">
    <ng-icon name="heroPlus" size="1.5rem" class="shrink-0" color="text-white"></ng-icon>
    <span class="hidden sm:block">Rolle hinzufügen</span>
  </button>
</div>

<div class="grid items-start overflow-auto h-[calc(100%-4.5rem)] border-t border-gray-200">
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th class="text-right"></th>
      </tr>
    </thead>
    <tbody>
      @for (role of filteredRoles; track role.id) {
        <tr
          [routerLink]="role.id"
          [routerLinkActive]="'bg-primary-content border-l-4 border-l-primary'"
          class="cursor-pointer hover:bg-primary-content">
          <td>
            <div class="flex items-center gap-4">
              <div class="avatar shrink-0 transition-colors" [attr.data-alias]="role.name | alias"></div>
              <div class="flex flex-col">
                {{ role.name }}
                @if (role.details) {
                  <span class="text-xs opacity-70">{{ role.details }}</span>
                }
              </div>
            </div>
          </td>
          <td class="text-right">
            <button class="btn cursor-pointer hidden" (click)="duplicateRole(role)">
              <ng-icon name="heroDocumentDuplicate" size="1lh" class="shrink-0" color="text-gray-500"></ng-icon>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <div class="border-gray-200 p-4 border-t self-stretch md:border-t-0 md:border-l">
    <router-outlet></router-outlet>
  </div>
</div>

<app-dialog title="Rolle hinzufügen">
  <form [formGroup]="roleAddGroup" class="flex flex-col gap-4" (ngSubmit)="onAddRole()">
    <label class="input" for="name">
      <span class="label">Name*</span>
      <input type="text" id="name" required formControlName="name" />
    </label>

    <label class="input" for="id">
      <span class="label">Identifikation*</span>
      <input type="text" id="id" required formControlName="id" />
    </label>

    <label class="input" for="description">
      <span class="label">Beschreibung*</span>
      <input type="text" id="description" required formControlName="description" />
    </label>

    <div class="flex justify-around items-center gap-4">
      <button class="btn btn-outline btn-primary grow" type="reset" (click)="closeDialog()">Abbrechen</button>
      <button class="btn btn-primary grow" type="submit" [disabled]="roleAddGroup.invalid">Erstellen</button>
    </div>
  </form>
</app-dialog>
