<div class="flex justify-between items-center gap-4">
  <app-filter (outputTerm)="onFilterTerm($event)"></app-filter>
  <button class="btn btn-primary" (click)="createUser()">
    <ng-icon name="heroPlus" size="1.5rem" class="shrink-0" color="text-white"></ng-icon>
    <span class="hidden sm:block">Neuen Nutzer erstellen</span>
  </button>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Status</th>
      <th>Name</th>
      <th>E-Mail</th>
      <th class="text-right">Aktion</th>
    </tr>
  </thead>
  <tbody>
    @for (user of filteredUsers; track user.id) {
      <tr [routerLink]="user.id" class="cursor-pointer hover:bg-gray-100">
        <td>
          @if (user.status) {
            <div aria-label="success" class="status status-success shrink-0"></div>
          } @else {
            <div aria-label="success" class="status status-neutral shrink-0"></div>
          }
        </td>
        <td>
          <div class="flex items-center gap-4">
            <div class="avatar shrink-0 transition-colors" [attr.data-alias]="user.name | alias"></div>
            {{ user.name }}
          </div>
        </td>
        <td>{{ user.email }}</td>
        <td class="text-right">
          <button class="btn" (click)="deleteUser(user.id)">
            <ng-icon name="heroTrash" size="1lh" class="shrink-0" color="text-gray-500"></ng-icon>
            <span class="hidden lg:block">Entfernen</span>
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>

<div>
  <router-outlet></router-outlet>
</div>

<app-dialog title="Neuen Nutzer anlegen">
  <form [formGroup]="userAddGroup" class="flex flex-col gap-4" (ngSubmit)="onAddUser()">
    <label class="input" for="name">
      <span class="label">Name*</span>
      <input type="text" id="name" required formControlName="name" />
    </label>

    <label class="input" for="email">
      <span class="label">E-Mail*</span>
      <input type="email" id="email" required formControlName="email" />
    </label>

    <label class="input" for="password">
      <span class="label">Passwort*</span>
      <input type="password" id="password" required formControlName="password" />
    </label>

    <div class="flex justify-around items-center gap-4">
      <button class="btn btn-outline grow" type="reset" (click)="closeDialog()">Abbrechen</button>
      <button class="btn grow" type="submit" [disabled]="userAddGroup.invalid">Erstellen</button>
    </div>
  </form>
</app-dialog>
