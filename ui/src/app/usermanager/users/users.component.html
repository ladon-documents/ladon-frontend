<div class="flex justify-between items-center gap-4 p-4">
  <app-filter (outputTerm)="onFilterTerm($event)"></app-filter>
  <button class="btn btn-primary btn-sm" (click)="createUser()">
    <ng-icon name="heroPlus" size="1.5rem" class="shrink-0" color="text-white"></ng-icon>
    <span class="hidden sm:block">Nutzer hinzufügen</span>
  </button>
</div>

<div class="grid items-start overflow-auto h-[calc(100%-4.5rem)] border-t border-gray-500/40">
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>E-Mail</th>
        <th class="text-right" colspan="2"></th>
      </tr>
    </thead>
    <tbody>
      @for (user of filteredUsers; track user.id) {
        <tr
          [routerLink]="user.id"
          [routerLinkActive]="'bg-primary/10 border-l-4 border-l-primary'"
          class="cursor-pointer hover:bg-primary/10">
          <td>
            <div class="flex items-center gap-4">
              <div
                class="avatar shrink-0 transition-colors"
                [ngClass]="user.status ? 'status-success' : 'status-neutral'"
                [attr.data-alias]="user.name | alias"></div>
              {{ user.name }}
            </div>
          </td>
          <td class="grow">{{ user.email }}</td>
          <td class="text-right">
            <button class="btn cursor-pointer hidden" (click)="duplicateUser(user)">
              <ng-icon name="heroDocumentDuplicate" size="1lh" class="shrink-0" color="text-gray-500"></ng-icon>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <div class="border-gray-500/40 p-4 border-t self-stretch lg:border-t-0 lg:border-l">
    <router-outlet></router-outlet>
  </div>
</div>

<app-dialog title="Nutzer hinzufügen">
  <form [formGroup]="userAddGroup" class="flex flex-col gap-4" (ngSubmit)="onAddUser()">
    <label class="input" for="name">
      <span class="label">Name*</span>
      <input type="text" id="name" required formControlName="name" />
    </label>

    <label class="input" for="email">
      <span class="label">E-Mail*</span>
      <input type="email" id="email" required formControlName="email" />
    </label>

    <label class="input" for="userid">
      <span class="label">Nutzerkennung*</span>
      <input type="text" id="userid" required formControlName="userid" />
    </label>

    <label class="input" for="password">
      <span class="label">Passwort*</span>
      <input type="password" id="password" required formControlName="password" />
    </label>

    <div class="flex justify-around items-center gap-4">
      <button class="btn btn-outline btn-primary grow" type="reset" (click)="closeDialog()">Abbrechen</button>
      <button class="btn btn-primary grow" type="submit" [disabled]="userAddGroup.invalid">Erstellen</button>
    </div>
  </form>
</app-dialog>
