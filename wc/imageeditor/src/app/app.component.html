<div class="h-full min-h-0 flex flex-col border border-base-300 rounded-box bg-base-100">
  <div class="flex items-center justify-between p-4 border-b border-base-300">
    <h3 class="text-lg font-semibold">Bildbearbeitung</h3>
    <button class="btn btn-ghost btn-sm" type="button" (click)="close()">Schliessen</button>
  </div>

  @if (error) {
    <div class="alert alert-error mx-4 mt-4">
      <span>{{ error }}</span>
    </div>
  }

  <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12">
    <aside class="lg:col-span-4 xl:col-span-3 p-4 border-b lg:border-b-0 lg:border-r border-base-300 overflow-auto space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <button class="btn btn-outline btn-sm" type="button" (click)="undo()" [disabled]="!canUndo">Undo</button>
        <button class="btn btn-outline btn-sm" type="button" (click)="redo()" [disabled]="!canRedo">Redo</button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button class="btn btn-outline btn-sm" type="button" (click)="rotateLeft()">Links drehen</button>
        <button class="btn btn-outline btn-sm" type="button" (click)="rotateRight()">Rechts drehen</button>
      </div>

      <button class="btn btn-outline btn-sm w-full" type="button" [class.btn-info]="isCropMode" (click)="toggleCropMode()">
        Crop {{ isCropMode ? 'aktiv' : 'starten' }}
      </button>

      @if (isCropMode) {
        <p class="text-xs opacity-70">Mit der Maus auf dem Bild eine Auswahl ziehen.</p>
      }

      <div class="space-y-2">
        <label class="text-sm font-medium block">Helligkeit: {{ brightness }}%</label>
        <input type="range" min="0" max="200" [(ngModel)]="brightness" (input)="onFilterPreview()" (change)="onFilterCommit()" class="range range-xs" />

        <label class="text-sm font-medium block">Kontrast: {{ contrast }}%</label>
        <input type="range" min="0" max="200" [(ngModel)]="contrast" (input)="onFilterPreview()" (change)="onFilterCommit()" class="range range-xs" />

        <label class="text-sm font-medium block">Sättigung: {{ saturate }}%</label>
        <input type="range" min="0" max="200" [(ngModel)]="saturate" (input)="onFilterPreview()" (change)="onFilterCommit()" class="range range-xs" />

        <label class="text-sm font-medium block">Graustufen: {{ grayscale }}%</label>
        <input type="range" min="0" max="100" [(ngModel)]="grayscale" (input)="onFilterPreview()" (change)="onFilterCommit()" class="range range-xs" />

        <label class="text-sm font-medium block">Sepia: {{ sepia }}%</label>
        <input type="range" min="0" max="100" [(ngModel)]="sepia" (input)="onFilterPreview()" (change)="onFilterCommit()" class="range range-xs" />
      </div>

      <div class="divider my-1"></div>

      <label class="label cursor-pointer justify-start gap-2">
        <input type="checkbox" class="checkbox checkbox-sm" [(ngModel)]="compareMode" (change)="onCompareChange()" />
        <span class="label-text">Vorher/Nachher</span>
      </label>

      @if (compareMode) {
        <label class="text-sm font-medium block">Split: {{ comparePosition }}%</label>
        <input type="range" min="0" max="100" [(ngModel)]="comparePosition" (input)="onCompareChange()" class="range range-xs" />
      }

      <div class="divider my-1"></div>

      <div class="space-y-2">
        <label class="text-sm font-medium block">Output-Format</label>
        <select class="select select-bordered select-sm w-full" [(ngModel)]="outputFormat">
          <option value="original">Original</option>
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WebP</option>
        </select>
      </div>

      @if (showQualityControl) {
        <label class="text-sm font-medium block">Qualität: {{ quality }}%</label>
        <input type="range" min="40" max="100" [(ngModel)]="quality" class="range range-xs" />
      }

      <div class="divider my-1"></div>

      <label class="label cursor-pointer justify-start gap-2">
        <input type="checkbox" class="checkbox checkbox-sm" [(ngModel)]="saveAsEnabled" />
        <span class="label-text">Speichern unter</span>
      </label>

      @if (saveAsEnabled) {
        <input class="input input-bordered input-sm w-full" type="text" [(ngModel)]="saveAsFileName" placeholder="bild.jpg" />
      }

      <button class="btn btn-ghost btn-sm w-full" type="button" (click)="resetAdjustments()">Zurücksetzen</button>
    </aside>

    <main class="lg:col-span-8 xl:col-span-9 p-4 overflow-auto flex items-center justify-center bg-base-200/40">
      @if (isLoading) {
        <span class="loading loading-spinner loading-lg"></span>
      } @else {
        <canvas
          #canvas
          class="max-w-full max-h-full border border-base-300 rounded-lg bg-base-100"
          [class.cursor-crosshair]="isCropMode"
          [class.cursor-default]="!isCropMode"
          (mousedown)="onCanvasMouseDown($event)"
          (mousemove)="onCanvasMouseMove($event)"
          (mouseup)="onCanvasMouseUp()"
          (mouseleave)="onCanvasMouseUp()"></canvas>
      }
    </main>
  </div>

  <div class="p-4 border-t border-base-300 flex justify-end gap-2">
    <button class="btn btn-ghost" type="button" (click)="close()" [disabled]="isSaving">Abbrechen</button>
    <button class="btn btn-primary" type="button" (click)="save()" [disabled]="isSaving || isLoading">
      {{ isSaving ? 'Speichert...' : (saveAsEnabled ? 'Speichern unter' : 'Speichern') }}
    </button>
  </div>
</div>
