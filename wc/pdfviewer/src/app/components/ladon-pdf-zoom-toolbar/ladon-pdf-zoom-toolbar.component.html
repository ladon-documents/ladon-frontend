<div id="toolbarViewerMiddle">
  <button class="btn btn-square" id="zoomOut">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" />
    </svg>
    <span class="sr-only">Zoom Out</span>

  </button>
  <button class="btn btn-square" id="zoomIn">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
    </svg>
    <span class="sr-only">Zoom In</span>

  </button>

  <div style="width: unset; max-width: unset;padding-top:3px">
    <span id="scaleSelectContainer">
      <select id="scaleSelect"
          title="Zoom"
          data-l10n-id="zoom"
          #sizeSelector>
      <option *ngFor="let level of zoomLevels"
            [id]="level.id"
            [attr.value]="level.value"
            [attr.data-l10n-id]="level.dataL10nId"
            [attr.data-l10n-args]="level.dataL10nArgs">
      {{level.displayValue}}
      </option>
      <option id="customScaleOption"
            title=""
            value="custom"
            disabled="disabled"
            hidden="true"
      ></option>
    </select>
  </span>
  </div>


</div>
