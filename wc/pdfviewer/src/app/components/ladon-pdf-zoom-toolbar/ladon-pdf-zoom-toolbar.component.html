<div id="toolbarViewerMiddle">
  <button class="transparent" id="zoomOut">
    <span class="webix_icon wxi-minus"></span>
  </button>
  <button class="transparent" id="zoomIn">
    <span class="webix_icon wxi-plus"></span>
  </button>

  <div style="width: unset; max-width: unset;padding-top:3px">
    <span id="scaleSelectContainer">
      <select id="scaleSelect"
          title="Zoom"
          data-l10n-id="zoom"
          #sizeSelector>
      <option *ngFor="let level of zoomLevels"
            [id]="level.id"
            [attr.value]="level.value"
            [attr.data-l10n-id]="level.dataL10nId"
            [attr.data-l10n-args]="level.dataL10nArgs">
      {{level.displayValue}}
      </option>
      <option id="customScaleOption"
            title=""
            value="custom"
            disabled="disabled"
            hidden="true"
      ></option>
    </select>
  </span>
  </div>


</div>
